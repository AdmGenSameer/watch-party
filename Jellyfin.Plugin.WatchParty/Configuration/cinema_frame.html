<!DOCTYPE html>
<html>
<head>
    <title>Watch Party</title>
    <style>
        .watchparty-cinema-wrap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            z-index: 1000;
        }

        .watchparty-cinema-frame {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: #000;
        }

        .watchparty-floating-bar {
            position: fixed;
            top: 14px;
            right: 18px;
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
            opacity: 0.75;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .watchparty-floating-bar:hover {
            opacity: 1;
            transform: translateY(-1px);
        }

        .watchparty-nav-btn {
            background: rgba(18, 18, 22, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #f4f4f5;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 9999px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 500;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
        }

        .watchparty-nav-btn:hover {
            background: #e50914;
            border-color: #e50914;
            color: #ffffff;
        }
    </style>
</head>
<body style="margin:0; padding:0; overflow:hidden; background:#000;">
    <div id="watchPartyCinemaPage" data-role="page" class="page type-interior pluginConfigurationPage" style="padding:0 !important; margin:0 !important; width:100% !important; height:100% !important; overflow:hidden !important; position:fixed; top:0; left:0; right:0; bottom:0; background:#000;">
        <div class="watchparty-cinema-wrap">
            <div class="watchparty-floating-bar">
                <a id="wpBtnPopout" href="/tokoshan/" target="_blank" class="watchparty-nav-btn" title="Open Watch Party in standalone browser tab">
                    <span>↗ Pop Out</span>
                </a>
                <button type="button" class="watchparty-nav-btn" onclick="history.back();" title="Return to Jellyfin">
                    <span>✕ Exit Cinema</span>
                </button>
            </div>
            <iframe id="cinemaFrame" 
                    class="watchparty-cinema-frame" 
                    src="/tokoshan/" 
                    allow="autoplay; fullscreen; camera; microphone; display-capture; clipboard-read; clipboard-write">
            </iframe>
        </div>

        <script type="text/javascript">
            (function() {
                var frame = document.getElementById('cinemaFrame');
                var popoutBtn = document.getElementById('wpBtnPopout');
                var targetUrl = window.location.origin + '/tokoshan/';
                
                if (frame) {
                    frame.src = targetUrl;
                }
                if (popoutBtn) {
                    popoutBtn.href = targetUrl;
                }
            })();
        </script>
    </div>
</body>
</html>
